url_prefix: /llm
proxy_consumer_timeout: 600

litellm_mode: built-in
external_litellm_url: ""
litellm_master_key: null
allow_project_own_llms: true

# Advanced, raw-config-only overrides for the /llm/v1 proxy pass-through. Not in the
# Admin UI on purpose - edit via the runtime config API.
# additional_litellm_params:
#   additional_drop_params: []          # param names to drop from every request
#   model_drop_params:                  # param names to drop, but only for these
#     some.model.prefix: [temperature]  # matched by client-sent model name prefix

# Read-only access to LiteLLM's own spend table, used to list the members of a project who
# actually spent. Same two keys the runtime engine uses, so a custom deployment configures
# them the same way in both places.
# elitea - derive the URL from the platform database, swapping only the database name
# custom - use database_url verbatim
litellm_database_mode: elitea
litellm_db_name: litellm
database_url: null
#
# Small on purpose: this pool serves the Usage page, not the request path, and results are
# cached per project for a minute.
spend_db:
  pool_size: 2
  max_overflow: 3

# Monthly spend limits for SHARED models, enforced by LiteLLM via per-request tags.
# Calls to a project's own (BYO) or externally-managed models are never counted.
# Manage these from Admin -> Features -> Cost Budgets rather than editing by hand.
cost_budgets:
  # off     - no tagging, no writes to LiteLLM, no blocking. Requests are identical
  #           to pre-feature behaviour, so this is a true rollback switch.
  # observe - tag and track spend, but never push a limit: nothing is ever blocked.
  #           Use this to measure real per-project spend before choosing limits.
  # enforce - track spend and reject calls once a limit is exceeded (HTTP 400).
  # Note: switching away from enforce lifts any ceilings already pushed to LiteLLM.
  mode: "off"
  #
  # The per-scope default limits live in elitea_core's config, next to the ladder that
  # reads them (elitea_core/rpc/budget_limits.py); this plugin only delegates.
  #
  # Percentage of a limit at which the Usage page warns. Per scope, since a shared
  # team budget and one member's slice of it warrant different lead times.
  # Only affects warnings: nothing is ever blocked before 100%.
  warning_thresholds:
    project_pct: 80
    personal_project_pct: 80
    user_pct: 80
